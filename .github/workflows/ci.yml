name: EstateScout PWA checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install pytest
      - name: Run Python tests
        run: python -m pytest -q
      - name: Validate JavaScript
        run: |
          node --check app/js/main.js
          node --check sw.js
      - name: Reject whitespace errors
        # Skip generated Capacitor/Gradle/Xcode templates (they ship with
        # CRLF/whitespace quirks we don't control; see ios/ and android/).
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD \
            | grep -v -E '^(ios/|android/|node_modules/)' || true)
          if [ -n "$FILES" ]; then
            git diff --check HEAD~1 HEAD -- $FILES
          fi
